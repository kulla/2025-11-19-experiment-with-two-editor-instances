<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Yjs Two Panels (no provider)</title>
  <style>
    body { font-family: sans-serif; margin: 0; padding: 20px; }
    h2 { margin-top: 0; }
    .container {
      display: flex;
      gap: 20px;
    }
    .panel {
      flex: 1;
      display: flex;
      flex-direction: column;
    }
    .panel h3 {
      margin: 0 0 8px 0;
    }
    textarea {
      flex: 1;
      width: 100%;
      resize: vertical;
      min-height: 200px;
      padding: 8px;
      box-sizing: border-box;
      border-radius: 6px;
      border: 1px solid #ccc;
      font-family: monospace;
    }
  </style>
		<script type="module"> import * as Y from 'https://cdn.jsdelivr.net/npm/yjs@13.6.27/+esm'
const ydoc = new Y.Doc();

    // Shared text type
    const ytext = ydoc.getText('shared');

    // DOM elements
    const panelA = document.getElementById('panelA');
    const panelB = document.getElementById('panelB');

    // Whenever Y.Text changes, update both panels to reflect the current state
    ytext.observe(() => {
      const text = ytext.toString();
      if (panelA.value !== text) panelA.value = text;
      if (panelB.value !== text) panelB.value = text;
    });

    // Helper to update Y.Text from a textarea
    const updateFromTextarea = (sourceElem) => {
      console.log('Updating from', sourceElem.id);

		const newText = sourceElem.value;
      // Replace whole content inside a Yjs transaction
      ydoc.transact(() => {
        ytext.delete(0, ytext.length);
        ytext.insert(0, newText);
      });
    };

    // Listen for user input on both panels
    panelA.addEventListener('input', () => updateFromTextarea(panelA));
    panelB.addEventListener('input', () => updateFromTextarea(panelB));

    // Optional: initial content
    ydoc.transact(() => {
      ytext.insert(0, 'This text is shared between Panel A and Panel B.\nTry editing in either one!');
    });
		</script>
</head>
<body>
  <h2>Yjs Shared Text – Two Panels (no network)</h2>
  <p>Typing in one panel updates the other because both are bound to the same Y.Text.</p>

  <div class="container">
    <div class="panel">
      <h3>Panel A</h3>
      <textarea id="panelA" placeholder="Type here in Panel A..."></textarea>
    </div>
    <div class="panel">
      <h3>Panel B</h3>
      <textarea id="panelB" placeholder="Type here in Panel B..."></textarea>
    </div>
  </div>

  <script>


    // Create a local Yjs document (no provider)
    
  </script>
</body>
</html>
